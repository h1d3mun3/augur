# augur egress allowlist (global baseline)
#
# This file is the safe default installed to ~/.augur/augur.conf. Only the domains
# listed here (and in a project's ./.augur.conf) are reachable from the
# container/VM; everything else is blocked by the host-side augur-proxy.
#
# Syntax (one pattern per line, '#' starts a comment):
#   example.com     exact host only (the apex). Does NOT match subdomains.
#   *.example.com   subdomains only (api.example.com yes; example.com no).
#   .example.com    the apex AND every subdomain.
#
# Add a project's own endpoints to ./.augur.conf in the project root, NOT here.

# ── Claude Code runtime ───────────────────────────────────────────────────────
api.anthropic.com
.claude.ai
.claude.com
*.anthropic.com
statsig.anthropic.com
statsig.com
*.statsig.com
sentry.io
*.sentry.io

# ── GitHub (gh / git over HTTPS) ──────────────────────────────────────────────
github.com
api.github.com
codeload.github.com
objects.githubusercontent.com
raw.githubusercontent.com
*.githubusercontent.com

# ── npm ───────────────────────────────────────────────────────────────────────
registry.npmjs.org

# ── Homebrew (macOS VM mode) ──────────────────────────────────────────────────
formulae.brew.sh
ghcr.io
*.ghcr.io
