name: Egress drift reminder

# NON-BLOCKING nudge. When a PR changes the egress CORE but does NOT also touch the
# security-review snapshots, remind the author to run /egress-survey and refresh the
# docs (a dated snapshot under docs/security-reviews/ and/or INVARIANTS.md) if the
# change drifted the egress posture.
#
# This never fails a PR and it does NOT verify correctness — that is ci.yml's job
# (`swift test`) plus the local egress fail-closed E2E gate. It only posts/updates a
# single sticky comment, and resolves it once the PR touches docs/security-reviews/.
#
# The `paths` filter is the "egress core changed" precondition; the job then checks
# whether docs/security-reviews/ changed too. Fork PRs are skipped (their read-only
# token can't comment) — the maintainer's own branch PRs are the intended audience.

on:
  pull_request:
    paths:
      - 'augur'
      - 'augur.conf'
      - 'augur-proxy/**'
      - 'gvproxy/**'
      - 'augur-vm/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: egress-drift-reminder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remind:
    name: remind
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs get a read-only token that cannot post comments.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Post or resolve the drift reminder
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- egress-drift-reminder -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Did this PR also update the security-review docs?
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const touchedDocs = files.some(f => f.filename.startsWith('docs/security-reviews/'));

            // Find our existing sticky comment, if any.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            const reminder = [
              marker,
              '### 🧭 Egress drift reminder',
              '',
              'This PR changes the **egress core** (`augur` / `augur-proxy/` / `gvproxy/` / `augur.conf` / `augur-vm/`) but does **not** touch `docs/security-reviews/`.',
              '',
              'If this change alters the egress posture, please:',
              '- run `/egress-survey` (the bounded drift audit), and',
              '- if it drifted: add a new dated snapshot under `docs/security-reviews/` and/or update `docs/security-reviews/INVARIANTS.md`.',
              '',
              '_Non-blocking reminder. It does not verify correctness (that is the egress fail-closed E2E + `swift test`). If no doc update is needed, ignore this._',
            ].join('\n');

            const resolved = [
              marker,
              '### ✅ Egress drift reminder — resolved',
              '',
              'This PR updates `docs/security-reviews/` alongside the egress-core change. Thanks!',
            ].join('\n');

            if (touchedDocs) {
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: resolved });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: reminder });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: reminder });
            }
